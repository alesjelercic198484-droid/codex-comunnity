<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeX Roleplay | Drug Missions</title><link rel="stylesheet" href="style.css"></head><body><main id="app" class="hidden"><header><div><span class="eyebrow">CODEX ROLEPLAY</span><h1>Drug Mission Control</h1></div><button id="close">×</button></header><section class="toolbar"><label>Mission<select id="missionSelect"></select></label><button class="secondary" id="newMission">New mission</button><button class="primary" id="save">Save mission</button></section><div class="grid"><section class="card"><h2>Mission setup</h2><label>Name<input id="name" placeholder="Dock Drug Run"></label><label>ID<input id="id" placeholder="dock_drug_run"></label><div class="locations"><h3>Locations</h3><button data-pos="npc">Set NPC position</button><button data-pos="vehicleSpawn">Set vehicle spawn</button><button data-pos="destination">Set destination</button><button data-pos="rewardNpc">Set reward NPC position</button><pre id="positions">No positions captured.</pre></div><label>Mission vehicle<input id="vehicle" placeholder="speedo"></label><label>Vehicle colour <input id="color" value="20,20"></label><label>Reward NPC model<input id="rewardModel" value="g_m_m_mexboss_01"></label></section><section class="card"><h2>Attack waves</h2><p class="hint">Each wave supports up to four vehicles. Four seats are filled per vehicle.</p><div id="waves"></div><h2>Rewards</h2><div id="rewards"></div><button class="secondary" id="addReward">+ Add reward</button></section></div></main><script src="app.js"></script></body></html>
