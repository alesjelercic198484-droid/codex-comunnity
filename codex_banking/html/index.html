<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeX Banking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app hidden">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-mark"><span>C</span></div>
        <div><strong>CODEX</strong><small>BANKING NETWORK</small></div>
      </div>
      <div class="member-card">
        <div class="member-avatar" id="avatar">C</div>
        <div class="member-meta"><strong id="member-name">Citizen</strong><span id="member-cid">ID —</span></div>
        <span class="online-dot"></span>
      </div>
      <div class="nav-label" id="nav-label">Personal banking</div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-bottom">
        <div class="secure-note"><span class="secure-icon">⌑</span><span id="secure-label">Secure connection<br><b>256-bit protection</b></span></div>
        <button id="close-button" class="close-button"><span>×</span><span id="close-label">Close banking</span><kbd>ESC</kbd></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span id="top-network">CodeX Network</span><span class="crumb-sep">/</span><strong id="page-title">Overview</strong></div>
        <div class="topbar-right"><span class="market-pill"><i></i><span id="network-status">Network online</span></span><button class="icon-button" id="close-icon" aria-label="Close">×</button></div>
      </header>
      <section class="content" id="content"></section>
    </main>
    <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
